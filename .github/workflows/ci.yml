name: Python tests and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check
      - name: Compile and test
        run: |
          python -m compileall -q hiv_resistance_agent.py hiv_art_resistance_agent agents
          python -m pytest -q
      - name: Verify empty audit chain
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
